      selector:
        text:
    clear_group_id:
      name: Clear group ID first
      description: Clears the existing group IDs while taking the room apart
      selector:
        boolean:
    delete_virtual_shutter_contacts:
      name: Delete virtual contacts first
      description: Deletes included virtual window contacts while taking the room apart
      selector:
        boolean:
    bidirectional:
      name: Bidirectional
      description: Uses link partners in both directions
      selector:
        boolean:
export_topology:
  name: Export MAX! topology
  description: 'Exports the known MAX! topology as a JSON file: all known devices, group IDs, link partners,
    week profiles and virtual contacts.'
  fields:
    path:
      name: File path
      description: Optional JSON target path. Relative paths are saved below the Home Assistant configuration
        directory.
      selector:
        text:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
import_topology:
  name: Import MAX! topology
  description: 'Imports a previously exported MAX! topology from a JSON file or a JSON string. It works
    carefully: existing devices are updated and missing virtual contacts can be created, but unknown physical
    devices are not created.'
  fields:
    path:
      name: File path
      description: Optional JSON source path. Relative paths are resolved against the Home Assistant configuration
        directory.
      selector:
        text:
    topology_json:
      name: Topology JSON
      description: Alternatively paste the complete export JSON
      selector:
        text:
          multiline: true
    create_virtual_devices:
      name: Create virtual contacts
      description: Creates missing virtual MAX! window contacts from the backup
      selector:
        boolean:
    update_names:
      name: Apply names
      description: Applies stored device names as well as serial and firmware data
      selector:
        boolean:
    apply_group_ids:
      name: Apply group IDs
      description: Writes the stored MAX! group IDs back
      selector:
        boolean:
    apply_links:
      name: Apply link partners
      description: Writes the stored on-device associations back
      selector:
        boolean:
    apply_week_profiles:
      name: Apply week profiles
      description: Writes the stored week profiles of climate devices back
      selector:
        boolean:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
cleanup_superseded_devices:
  name: Clean up replaced devices
  description: Removes old devices marked as replaced from the cul_max store. Optionally also removes
    their entity and device registry entries. By default it runs as a dry run and only logs what would
    be removed.
  fields:
    dry_run:
      name: Check only
      description: When on, only the candidates are logged and nothing is deleted
      selector:
        boolean:
    remove_registry_entries:
      name: Remove registry entries
      description: Removes the related entity and device registry entries from Home Assistant
      selector:
        boolean:
    remove_discovered_devices:
      name: Remove discovered devices
      description: Also removes old devices that were only discovered and never paired
      selector:
        boolean:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
start_vacation:
  name: Start vacation mode
  description: Puts the thermostats into MAX! vacation mode. They hold the vacation temperature and return
    to their week program at the return time (minus preheating) by themselves – even without Home Assistant.
    Thermostats set to manual before are restored afterwards. Without fields the settings on the CUL device
    apply to all thermostats.
  fields:
    temperature:
      name: Vacation temperature
      description: Temperature while away
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
    end:
      name: Return
      description: Date and time of the return (30-minute resolution)
      selector:
        datetime:
    preheat_hours:
      name: Preheating
      description: This many hours before the return the thermostats go back to their program
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          mode: box
          unit_of_measurement: h
    entity_ids:
      name: Thermostats
      description: Only these thermostats (empty = all)
      selector:
        entity:
          multiple: true
          filter:
            integration: cul_max
            domain: climate
    areas:
      name: Areas
      description: Only thermostats in these areas (empty = all)
      selector:
        area:
          multiple: true
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
end_vacation:
  name: End vacation mode
  description: 'Ends the vacation early: thermostats go back to their week program or their previous manual
    state right away.'
  fields:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
start_summer:
  name: Start summer mode
  description: 'Heating season over: all MAX! thermostats go to off (valve closed) or on (valve fully
    open) until summer mode is ended.'
  fields:
    valve:
      name: Valve
      description: Off (valve closed) or on (valve fully open)
      selector:
        select:
          options:
            - closed
            - open
          translation_key: summer_valve
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
end_summer:
  name: End summer mode
  description: 'Heating season starts: every thermostat returns to its previous state.'
  fields:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
