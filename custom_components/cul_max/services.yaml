start_pairing:
  name: Start pairing
  description: Opens the pairing window for a chosen time. Then press the pairing button on the MAX! device
    to add it.
  fields:
    duration:
      name: Duration
      description: Pairing window in seconds, default 60
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          mode: box
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
set_device_name:
  name: Set device name
  description: Changes the display name of a known MAX! device.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      required: true
      selector:
        text:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    name:
      name: Name
      description: New display name
set_external_temperature_sensor:
  name: Use an external room sensor
  description: Lets a radiator thermostat regulate on a temperature sensor in Home Assistant instead of
    its own sensor at the radiator (virtual wall thermostat). Without a sensor it uses its own sensor
    again.
  fields:
    entity_id:
      name: Thermostat
      description: MAX! climate entity of the radiator thermostat
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    address:
      name: Address
      description: Alternatively the 6-digit hex address of the thermostat
      selector:
        text:
    sensor_entity_id:
      name: Temperature sensor
      description: Leave empty to use the thermostat's own sensor again
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature
wake_thermostats:
  name: Wake thermostats
  description: 'Sends WakeUp to all known thermostats to trigger immediate state updates or configuration
    steps. Not meant for regular use: frequent wake-ups cost battery and radio time.'
  fields:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
sync_time:
  name: Synchronise time
  description: Sends the current local time to selected or all known MAX! thermostats and wall thermostats.
    Helpful when week programs do not seem to match the current weekday or time.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    addresses:
      name: Addresses
      description: Several 6-digit hex addresses
      selector:
        object:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    entity_ids:
      name: Thermostats
      description: Alternatively pick several MAX! climate entities
      selector:
        entity:
          multiple: true
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    device_names:
      name: Device names
      description: Alternatively several stored MAX! device names
      selector:
        object:
    gateway:
      name: Gateway
      description: Only needed with several CULs – which gateway is meant
      selector:
        config_entry:
          integration: cul_max
set_week_profile:
  name: Set week profile
  description: 'Sets a week profile for a thermostat or wall thermostat. Format per line: "Mon 21,06:00,17,22:00,16"'
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    profile:
      name: Week profile
      description: One or more lines in the format "Mon 21,06:00,17,22:00,16". Days not given stay unchanged.
      required: true
      selector:
        text:
          multiline: true
set_week_profile_days:
  name: Set week profile per day
  description: Sets the week profile with one field per weekday. Enter only the day, e.g. "21,08:00,26,22:00,13".
    Empty days stay unchanged.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    monday:
      name: Monday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    tuesday:
      name: Tuesday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    wednesday:
      name: Wednesday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    thursday:
      name: Thursday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    friday:
      name: Friday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    saturday:
      name: Saturday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
    sunday:
      name: Sunday
      description: Format e.g. "21,08:00,26,22:00,13"
      selector:
        text:
set_group_id:
  name: Set group ID
  description: Writes a MAX! group ID directly into a device. Devices in the same room should get the
    same group ID.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    group_id:
      name: Group ID
      description: Integer between 1 and 255
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
set_temperature_config:
  name: Set temperature configuration
  description: Writes the stored comfort, eco and window-open values of a thermostat or wall thermostat.
    Fields not given stay unchanged.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    comfort_temperature:
      name: Comfort temperature
      description: Day/comfort temperature in °C
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
    eco_temperature:
      name: Eco temperature
      description: Night/eco temperature in °C
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
    window_open_temperature:
      name: Window open temperature
      description: Target temperature while a window is open, in °C
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
    window_open_duration:
      name: Window open duration
      description: Duration in minutes, usually in steps of 5
      selector:
        number:
          min: 0
          max: 60
          step: 5
          mode: box
          unit_of_measurement: min
    measurement_offset:
      name: Temperature offset
      description: Offset of the internal temperature sensor in °C
      selector:
        number:
          min: -3.5
          max: 3.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
set_desired_temperature:
  name: Set target temperature
  description: 'Sets a MAX! target temperature with explicit mode semantics, close to FHEM: `auto`, `manual`,
    `boost` or temporarily until an `until` time. Without a mode, `keep_auto` respects the running week
    program.'
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Thermostat
      description: Alternatively pick a MAX! climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    temperature:
      name: Target temperature
      description: Temperature in °C
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          mode: box
          unit_of_measurement: °C
    mode:
      name: Mode
      description: '`auto` for the week program, `manual` for permanently manual, `boost` for boost. With
        `until` a temporary MAX! mode is used.'
      selector:
        select:
          options:
            - auto
            - manual
            - boost
    keep_auto:
      name: Keep auto
      description: Without a mode and while the device runs in `auto`, a temperature change keeps the
        auto context.
      selector:
        boolean:
    until:
      name: Valid until
      description: Optional end of a temporary target, e.g. `2026-04-06 22:30` or `06.04.2026 22:30`.
        MAX! only allows `:00` or `:30`.
      selector:
        text:
remove_group_id:
  name: Remove group ID
  description: Removes the MAX! group ID from a device.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the device (e.g. 1A2B3C)
      selector:
        text:
    entity_id:
      name: Device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
add_link_partner:
  name: Add link partner
  description: Creates a direct MAX! association between two devices. For a clean room link the reverse
    direction is usually needed as well.
  fields:
    address:
      name: Source address
      description: 6-digit hex address of the source device
      selector:
        text:
    entity_id:
      name: Source device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    device_name:
      name: Source device name
      description: Alternatively the stored name of the source device
      selector:
        text:
    partner_address:
      name: Partner address
      description: 6-digit hex address of the partner device
      selector:
        text:
    partner_entity_id:
      name: Partner device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    partner_name:
      name: Partner device name
      description: Alternatively the stored name of the partner device
      selector:
        text:
remove_link_partner:
  name: Remove link partner
  description: Removes a direct MAX! association between two devices.
  fields:
    address:
      name: Source address
      description: 6-digit hex address of the source device
      selector:
        text:
    entity_id:
      name: Source device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    device_name:
      name: Source device name
      description: Alternatively the stored name of the source device
      selector:
        text:
    partner_address:
      name: Partner address
      description: 6-digit hex address of the partner device
      selector:
        text:
    partner_entity_id:
      name: Partner device
      description: Alternatively pick a MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    partner_name:
      name: Partner device name
      description: Alternatively the stored name of the partner device
      selector:
        text:
    partner_type:
      name: Partner type (unknown partners only)
      description: Only needed to remove a stale link to a device the integration does not know (e.g.
        a replaced thermostat). 1 = radiator thermostat, 2 = radiator thermostat+, 3 = wall thermostat,
        4 = window contact, 5 = push button.
      selector:
        number:
          min: 1
          max: 5
          mode: box
associate_devices:
  name: Associate devices
  description: Sets a common group ID and creates link partners between all given devices – a real MAX!
    room link on the devices.
  fields:
    address:
      name: Address
      description: A single 6-digit hex address
      selector:
        text:
    addresses:
      name: Addresses
      description: List of 6-digit hex addresses
      selector:
        object:
    entity_id:
      name: Device
      description: Alternatively a single MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    entity_ids:
      name: Devices
      description: Alternatively a list of MAX! entities
      selector:
        entity:
          multiple: true
          filter:
            - integration: cul_max
              domain: climate
            - integration: cul_max
              domain: binary_sensor
              device_class: window
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    device_names:
      name: Device names
      description: Alternatively several stored MAX! device names
      selector:
        object:
    group_id:
      name: Group ID
      description: Common group ID between 1 and 255
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    bidirectional:
      name: Bidirectional
      description: Create the association in both directions
      selector:
        boolean:
deassociate_devices:
  name: Deassociate devices
  description: Removes the link partners between all given devices. Optionally the group IDs are cleared
    as well.
  fields:
    address:
      name: Address
      description: A single 6-digit hex address
      selector:
        text:
    addresses:
      name: Addresses
      description: List of 6-digit hex addresses
      selector:
        object:
    entity_id:
      name: Device
      description: Alternatively a single MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
    entity_ids:
      name: Devices
      description: Alternatively a list of MAX! entities
      selector:
        entity:
          multiple: true
          filter:
            - integration: cul_max
              domain: climate
            - integration: cul_max
              domain: binary_sensor
              device_class: window
    device_name:
      name: Device name
      description: Alternatively the stored MAX! device name
      selector:
        text:
    device_names:
      name: Device names
      description: Alternatively several stored MAX! device names
      selector:
        object:
    clear_group_id:
      name: Remove group ID
      description: Also clears the group ID of the devices after unlinking
      selector:
        boolean:
    bidirectional:
      name: Bidirectional
      description: Removes the association in both directions
      selector:
        boolean:
create_virtual_shutter_contact:
  name: Create virtual window contact
  description: Creates a virtual MAX! window contact with a free address. It can then be linked to thermostats
    via group ID and association and driven by external sensors.
  fields:
    address:
      name: Address
      description: Free 6-digit hex address, e.g. A1B2C3
      required: true
      selector:
        text:
    name:
      name: Name
      description: Display name of the virtual contact
      required: true
      selector:
        text:
    group_id:
      name: Group ID
      description: Optional MAX! group ID between 0 and 255
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
delete_virtual_device:
  name: Delete virtual device
  description: Deletes a previously created virtual MAX! device.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the virtual device
      selector:
        text:
    entity_id:
      name: Device
      description: Alternatively pick the virtual MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: binary_sensor
            device_class: window
    device_name:
      name: Device name
      description: Alternatively the stored name of the virtual device
      selector:
        text:
send_virtual_shutter_contact_state:
  name: Send virtual window contact
  description: Sends the state of a virtual MAX! window contact. With a group ID it acts on the linked
    devices of that group – e.g. from a Zigbee contact automation.
  fields:
    address:
      name: Address
      description: 6-digit hex address of the virtual window contact
      selector:
        text:
    entity_id:
      name: Virtual window contact
      description: Alternatively pick the virtual MAX! entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: binary_sensor
    device_name:
      name: Device name
      description: Alternatively the stored name of the virtual contact
      selector:
        text:
    is_open:
      name: Window open
      description: true for open, false for closed
      required: true
      selector:
        boolean:
create_room_association:
  name: Create room association
  description: 'Creates a complete MAX! room: common group ID, link partners between the given devices
    and optionally a virtual window contact for external sensors.'
  fields:
    room_name:
      name: Room name
      description: Display name for logging and optional virtual contacts
      required: true
      selector:
        text:
    group_id:
      name: Group ID
      description: Optional. If empty, the next free group ID is used
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    climate_address:
      name: Climate address
      description: A single radiator or wall thermostat address
      selector:
        text:
    climate_addresses:
      name: Climate addresses
      description: List of the radiator and wall thermostat addresses involved
      selector:
        object:
    climate_entity_id:
      name: Climate device
      description: Alternatively a single climate entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: climate
    climate_entity_ids:
      name: Climate devices
      description: Alternatively a list of the climate entities involved
      selector:
        entity:
          multiple: true
          filter:
            integration: cul_max
            domain: climate
    climate_device_name:
      name: Climate device name
      description: Alternatively a single stored MAX! device name
      selector:
        text:
    climate_device_names:
      name: Climate device names
      description: Alternatively a list of stored MAX! device names
      selector:
        object:
    window_address:
      name: Window contact address
      description: A single existing MAX! window contact address
      selector:
        text:
    window_addresses:
      name: Window contact addresses
      description: Optional list of existing MAX! window contacts
      selector:
        object:
    window_entity_id:
      name: Window contact
      description: Alternatively a single window contact entity
      selector:
        entity:
          filter:
            integration: cul_max
            domain: binary_sensor
            device_class: window
    window_entity_ids:
      name: Window contacts
      description: Alternatively a list of existing window contact entities
      selector:
        entity:
          multiple: true
          filter:
            integration: cul_max
            domain: binary_sensor
            device_class: window
    window_device_name:
      name: Window contact name
      description: Alternatively a single stored window contact name
      selector:
        text:
    window_device_names:
      name: Window contact names
      description: Alternatively a list of stored window contact names
      selector:
        object:
    create_virtual_shutter_contact:
      name: Create virtual contact
      description: Creates a virtual MAX! window contact right away
      selector:
        boolean:
    virtual_shutter_contact_address:
      name: Virtual address
      description: Optional. If empty, a free address is generated
      selector:
        text:
    virtual_shutter_contact_name:
      name: Virtual name
      description: Optional display name of the virtual window contact
      selector:
        text:
    bidirectional:
      name: Bidirectional
      description: Creates the link partners in both directions
      selector:
        boolean:
delete_room_association:
